<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ночной турнир</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,177.78vh);height:auto;display:block}
</style>

<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
'use strict';
const W=960,H=540,GY=500; // GY — линия пола: середина зоны, размеченной на арене («игровая зона.png»)
// WW — ширина арены (мир шире экрана); camX — левый край экрана в мире. Бойцы не расходятся дальше экрана.
const WW=1634,SPAN=W-90;
// AL..AR — где можно стоять: левее и правее пол уходит под стену, столы и бочки (картинка шире игровой зоны)
const AL=236,AR=1398; // края зоны для ходьбы (183…1450 на арене) с запасом на ширину бойца
let camX=(WW-W)/2;
const camTarget=()=>clamp((F[0].x+F[1].x)/2-W/2,0,WW-W);
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- ввод ----------
const down=new Set(),pressed=new Set();
addEventListener('keydown',e=>{
  if(!e.repeat){down.add(e.code);pressed.add(e.code);lastDev='key';}
  if(/Arrow|Space|Tab|Backspace/.test(e.code))e.preventDefault();
  audioInit();
});
addEventListener('keyup',e=>down.delete(e.code));
addEventListener('blur',()=>down.clear());
const KEYS_DEF=[
  {l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS',p1:'KeyR',p2:'KeyF',k1:'KeyT',k2:'KeyG',blk:'KeyH',s:'KeyY',g:'KeyU',run:'ShiftLeft'},
  {l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',p1:'KeyI',p2:'KeyK',k1:'KeyO',k2:'KeyL',blk:'Semicolon',s:'KeyP',g:'BracketLeft',run:'ShiftRight'}
];
const BK=['p1','p2','k1','k2','s'];
const newBuf=()=>({p1:0,p2:0,k1:0,k2:0,s:0});
// геймпад (стандартная раскладка, DualSense): 0 крест, 1 круг, 2 квадрат, 3 треугольник, 4 L1, 5 R1, 6 L2, 7 R2, 12-15 крестовина
// Геймпады берутся в порядке первого нажатия: устройство, которое только числится подключённым (руль, наушники,
// клавиатура с «геймпадным» режимом), номер игрока не занимает. Нестандартная раскладка (Firefox, DInput) тоже читается.
const rawPads=()=>navigator.getGamepads?[...navigator.getGamepads()].filter(g=>g&&g.connected):[];
let padAct=[];
function padRead(g){
  const b=n=>!!(g.buttons[n]&&(g.buttons[n].pressed||g.buttons[n].value>.5));
  const ax=g.axes[0]||0,ay=g.axes[1]||0;
  // fx fo fs ft — крест, круг, квадрат, треугольник как они есть: ими выбирают пункты меню, какой бы ни была настройка
  let m=PADMAP.std;
  if(g.mapping==='standard')
    return{l:b(14)||ax<-.4,r:b(15)||ax>.4,u:b(12)||ay<-.6,d:b(13)||ay>.55,
      p1:b(m.p1),p2:b(m.p2),k1:b(m.k1),k2:b(m.k2),blk:b(m.blk),run:b(m.run),s:b(m.s)||b(m.g),g:b(m.g),start:b(9),back:b(8),list:b(17),demo:b(10),combo:b(11),
      fx:b(0),fo:b(1),fs:b(2),ft:b(3)};
  m=PADMAP.raw;
  // DInput-раскладка PlayStation: 0 квадрат, 1 крест, 2 круг, 3 треугольник; крестовина — «шляпа» на оси 9 или оси 6/7
  let hl=false,hr=false,hu=false,hd=false;
  const h=g.axes[9];
  if(h!==undefined&&h>=-1.01&&h<=1.01){const k=Math.round((h+1)*3.5);hu=k===0||k===1||k===7;hr=k>=1&&k<=3;hd=k>=3&&k<=5;hl=k>=5&&k<=7;}
  if(g.axes.length>=8&&g.axes.length<10){hl=g.axes[6]<-.5;hr=g.axes[6]>.5;hu=g.axes[7]<-.5;hd=g.axes[7]>.5;}
  return{l:hl||ax<-.4,r:hr||ax>.4,u:hu||ay<-.6,d:hd||ay>.55,
    p1:b(m.p1),p2:b(m.p2),k1:b(m.k1),k2:b(m.k2),blk:b(m.blk),run:b(m.run),s:b(m.s)||b(m.g),g:b(m.g),start:b(9),back:b(8),list:b(13),demo:b(10),combo:b(11),
    fx:b(1),fo:b(2),fs:b(0),ft:b(3)};
}
function padScan(){
  const all=rawPads();
  padAct=padAct.filter(i=>all.some(g=>g.index===i));
  for(const g of all)if(!padAct.includes(g.index)&&(g.buttons.some(x=>x.pressed)||Math.abs(g.axes[0]||0)>.6||Math.abs(g.axes[1]||0)>.6))padAct.push(g.index);
  return all;
}
const pads=()=>{const all=padScan();return padAct.map(i=>all.find(g=>g.index===i)).filter(Boolean);};
const padPrev=[{},{}];
// merge — слить все геймпады в одного игрока (игра по сети: какой бы ни взял в руки, он сработает)
function padInput(i,merge){
  const list=pads(),o={};
  const src=merge?list:list[i]?[list[i]]:[];
  if(!src.length){padPrev[i]={};return o;}
  const cur={};
  for(const g of src){const c=padRead(g);for(const k in c)cur[k]=cur[k]||c[k];}
  const pv=padPrev[i];
  for(const k of['p1','p2','k1','k2','s','start','back','list','demo','combo','fx','fo','fs','ft'])o[k]=cur[k]&&!pv[k];
  if(i===0&&(o.p1||o.p2||o.k1||o.k2||o.s||o.fx||o.fo||o.fs||o.ft||o.start))lastDev='pad';
  o.lE=cur.l&&!pv.l;o.rE=cur.r&&!pv.r;o.uE=cur.u&&!pv.u;o.dE=cur.d&&!pv.d;
  o.l=cur.l;o.r=cur.r;o.u=cur.u;o.d=cur.d;o.blk=cur.blk;o.run=cur.run;o.g=cur.g;
  if(o.p1||o.p2||o.k1||o.k2||o.start)audioInit();
  padPrev[i]=cur;return o;
}
// строка диагностики: что браузер видит от геймпадов прямо сейчас
function padInfo(){
  const all=padScan();
  if(!all.length)return['Геймпад не виден: нажми на нём любую кнопку (вкладка должна быть активной)'];
  return all.map(g=>{
    const on=[];g.buttons.forEach((x,i)=>{if(x.pressed)on.push(i);});
    const pl=padAct.indexOf(g.index);
    return`${pl<0?'не активен':'игрок '+(pl+1)} · ${g.id.replace(/\s*\(.*$/,'').slice(0,34)} · ${g.mapping==='standard'?'стандарт':'нестандартная раскладка'}`+(on.length?` · кнопки ${on.join(',')}`:'');
  });
}
let PAD=[{},{}],IN=[{},{}];
function getInput(i){
  const m=KEYS[i],g=PAD[i];
  return{l:down.has(m.l)||!!g.l,r:down.has(m.r)||!!g.r,u:down.has(m.u)||!!g.u,d:down.has(m.d)||!!g.d,
    blk:down.has(m.blk)||!!g.blk,run:down.has(m.run)||!!g.run,
    p1:pressed.has(m.p1)||!!g.p1,p2:pressed.has(m.p2)||!!g.p2,k1:pressed.has(m.k1)||!!g.k1,k2:pressed.has(m.k2)||!!g.k2,
    s:pressed.has(m.s)||pressed.has(m.g)||!!g.s,g:down.has(m.g)||!!g.g,
    uE:pressed.has(m.u)||!!g.uE,dE:pressed.has(m.d)||!!g.dE,lE:pressed.has(m.l)||!!g.lE,rE:pressed.has(m.r)||!!g.rE};
}
function rumble(i,heavy){
  if(NET.on){if(i!==NET.me)return;i=0;} // по сети вибрирует только свой геймпад
  try{
    const g=pads()[i];
    if(g&&g.vibrationActuator)g.vibrationActuator.playEffect('dual-rumble',{duration:heavy?180:90,strongMagnitude:heavy?.9:.4,weakMagnitude:.5});
  }catch(e){}
}

// ---------- настройка управления ----------
// Клавиши двух игроков и кнопки геймпада можно переназначить (меню -> Управление); хранится в браузере игрока.
const KEYS=JSON.parse(JSON.stringify(KEYS_DEF));
// std — стандартная раскладка браузера, raw — нестандартная (DInput PlayStation)
const PAD_DEF={std:{p1:3,p2:2,k1:1,k2:0,blk:5,run:4,s:7,g:6},raw:{p1:3,p2:0,k1:2,k2:1,blk:5,run:4,s:7,g:6}};
const PADMAP=JSON.parse(JSON.stringify(PAD_DEF));
function ctlSave(){try{localStorage.setItem('nt_controls',JSON.stringify({k:KEYS,p:PADMAP}));}catch(e){}}
try{
  const s=JSON.parse(localStorage.getItem('nt_controls'));
  if(s){Object.assign(KEYS[0],s.k[0]);Object.assign(KEYS[1],s.k[1]);Object.assign(PADMAP.std,s.p.std);Object.assign(PADMAP.raw,s.p.raw);}
}catch(e){}
let lastDev='key'; // чем игрок 1 пользовался последним: от этого зависят подписи кнопок на экране
const KACT=[['l','Влево'],['r','Вправо'],['u','Прыжок'],['d','Присед'],['p1','Рука 1'],['p2','Рука 2'],['k1','Нога 1'],['k2','Нога 2'],
  ['blk','Блок'],['run','Бег'],['s','Спецприём'],['g','Захват / бросок']];
const PACT=KACT.slice(4);
const KNAME={ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',ShiftLeft:'LShift',ShiftRight:'RShift',ControlLeft:'LCtrl',ControlRight:'RCtrl',
  AltLeft:'LAlt',AltRight:'RAlt',Space:'Пробел',Semicolon:';',BracketLeft:'[',BracketRight:']',Quote:"'",Comma:',',Period:'.',Slash:'/',
  Backslash:'\\',Minus:'-',Equal:'=',Backquote:'`',CapsLock:'Caps'};
const kn=c=>!c?'—':KNAME[c]||(c.startsWith('Key')?c.slice(3):c.startsWith('Digit')?c.slice(5):c.startsWith('Numpad')?'Num'+c.slice(6):c);
const PBN={std:['✕','○','□','△','L1','R1','L2','R2','Create','Options','L3','R3','↑','↓','←','→','PS','тач'],
  raw:['□','✕','○','△','L1','R1','L2','R2','Share','Options','L3','R3','PS','тач']};
const pn=(i,t)=>PBN[t][i]||'кн.'+i;
const padType=g=>g&&g.mapping!=='standard'?'raw':'std';
// подпись действия для игрока i: геймпад — значок кнопки, клавиатура — название клавиши
function ctlLabel(a,i=0){
  const pad=i===0?lastDev==='pad':!NET.on&&!!pads()[1];
  if(!pad)return kn(KEYS[NET.on?0:i][a]);
  if('lrud'.includes(a))return{l:'←',r:'→',u:'↑',d:'↓'}[a];
  const t=padType(pads()[i]);
  return pn(PADMAP[t][a],t);
}
const KS={tab:0,row:0,wait:false,msg:'',held:new Set()};
const KRES=['Escape','Enter','Tab','Backspace','Delete','KeyM','KeyV','KeyC','KeyX','KeyB','Digit1','Digit2','Digit3','Digit4'];
addEventListener('keydown',e=>{
  if(G.phase!=='keys'||!KS.wait||KS.tab>1)return;
  e.preventDefault();pressed.delete(e.code);
  if(e.code==='Escape'){KS.wait=false;return;}
  const me=KEYS[KS.tab],other=KEYS[1-KS.tab],a=KACT[KS.row][0];
  if(KRES.includes(e.code)){KS.msg=`Клавиша ${kn(e.code)} занята самой игрой — выбери другую`;return;}
  const oa=Object.keys(other).find(k=>other[k]===e.code);
  if(oa){KS.msg=`Клавиша ${kn(e.code)} уже у игрока ${2-KS.tab} — выбери другую`;return;}
  const mine=Object.keys(me).find(k=>me[k]===e.code);
  if(mine&&mine!==a)me[mine]=me[a]; // клавиша была на другом действии — меняем местами
  me[a]=e.code;KS.wait=false;KS.msg='';ctlSave();snd('bell');
});
function keysMenu(){
  const acts=KS.tab<2?KACT:PACT,n=acts.length+1;
  const heldNow=new Set();
  for(const g of rawPads())g.buttons.forEach((x,bi)=>{if(x.pressed)heldNow.add(g.index+':'+bi);});
  if(KS.wait){
    if(KS.tab===2)for(const g of rawPads()){
      const bi=g.buttons.findIndex((x,i)=>x.pressed&&!KS.held.has(g.index+':'+i));
      if(bi<0)continue;
      const t=padType(g),m=PADMAP[t],a=PACT[KS.row][0];
      if(t==='std'?(bi===8||bi===9||bi>=12):(bi===8||bi===9)){KS.msg=`Кнопка ${pn(bi,t)} занята меню и движением — выбери другую`;break;}
      const mine=Object.keys(m).find(k=>m[k]===bi);
      if(mine&&mine!==a)m[mine]=m[a];
      m[a]=bi;KS.wait=false;KS.msg='';ctlSave();snd('bell');break;
    }
    KS.held=heldNow;return;
  }
  KS.held=heldNow;
  const p=PAD[0];
  if(pressed.has('Escape')||p.back){ctlSave();G.phase='menu';return;}
  if(pressed.has('ArrowUp')||p.uE)KS.row=(KS.row+n-1)%n;
  if(pressed.has('ArrowDown')||p.dE)KS.row=(KS.row+1)%n;
  if(pressed.has('ArrowLeft')||p.lE){KS.tab=(KS.tab+2)%3;KS.row=0;KS.msg='';}
  if(pressed.has('ArrowRight')||p.rE){KS.tab=(KS.tab+1)%3;KS.row=0;KS.msg='';}
  const reset=()=>{
    if(KS.tab<2)Object.assign(KEYS[KS.tab],KEYS_DEF[KS.tab]);
    else{Object.assign(PADMAP.std,PAD_DEF.std);Object.assign(PADMAP.raw,PAD_DEF.raw);}
    ctlSave();KS.msg='Раздел сброшен к стандартному';snd('bell');
  };
  if(pressed.has('Delete'))reset();
  if(pressed.has('Enter')||p.fx||p.start){
    if(KS.row===n-1)reset();
    else{KS.wait=true;KS.msg='';}
  }
}
function drawKeys(){
  ctx.fillStyle='rgba(5,5,15,.78)';ctx.fillRect(0,0,W,H);
  txt('УПРАВЛЕНИЕ',W/2,70,48,'#ffd24a');
  ['Клавиатура · игрок 1','Клавиатура · игрок 2','Геймпад'].forEach((t,i)=>txt(t,W/2+(i-1)*250,112,20,i===KS.tab?'#7dff8a':'#777'));
  const acts=KS.tab<2?KACT:PACT,g=pads()[0]||rawPads()[0],t=padType(g);
  const rows=[...acts.map(a=>[a[1],KS.tab<2?kn(KEYS[KS.tab][a[0]]):pn(PADMAP[t][a[0]],t)]),['Сбросить раздел к стандартному','']];
  const step=Math.min(28,330/rows.length),y0=150;
  rows.forEach((r,i)=>{
    const sel=i===KS.row,y=y0+i*step;
    if(sel){ctx.fillStyle='rgba(125,255,138,.14)';ctx.fillRect(W/2-230,y-step*.7,460,step*.92);}
    txt(r[0],W/2-210,y,18,sel?'#fff':'#ccc','left',true);
    txt(sel&&KS.wait?(KS.tab<2?'нажми клавишу…':'нажми кнопку…'):r[1],W/2+210,y,18,sel&&KS.wait?'#ffd24a':sel?'#7dff8a':'#fff','right',true);
  });
  if(KS.tab===2){
    txt('Движение — стик и крестовина (не меняется). Options и Create заняты меню.',W/2,H-78,13,'#bbb','center',true);
    txt('Геймпад: '+padInfo()[0],W/2,H-60,12,'#9fd8ff','center',true);
  }
  if(KS.msg)txt(KS.msg,W/2,H-38,15,'#ff9a7a','center',true);
  txt('↑ ↓ — выбор · ← → — раздел · Enter / ✕ — изменить · Delete — сбросить раздел · Esc / Create — назад (сохраняется само)',W/2,H-14,13,'#999','center',true);
}
// список приёмов с теми кнопками, на которых игрок играет
function moveList(ch){
  const l=ctlLabel,adv=[[],[],[],[]],STR=ch.str||window.STR_ALL,cs=ch.sp||{};
  const rows=Object.keys(STR).filter(k=>!Object.keys(STR).some(o=>o.startsWith(k+',')))
    .map(k=>{const b=k.split(','),ks=b.map((_,i)=>b.slice(0,i+1).join(','));adv.push(ks.map(s=>advOf(s,M[STR[s]],ch)));
      return b.map(x=>l(x)).join(' ')+'  '+ks.map(s=>LV[M[STR[s]].type]).join('')+moveTag(M[STR[k]]).replace(' — подброс',' ↑').replace(' — отскок от пола',' ↓').replace(' — в стену',' →').replace(' — ошеломление',' ✶');});
  rows.unshift('В верх · С середина · Н низ · О оверхед','блок стоя: В С О · блок сидя: В С Н','цифры — в блоке: + ты первый · − ты открыт','↑ подброс · ↓ от пола · → в стену · ✶ ошеломление');
  const sp=(s,n)=>{rows.push(s);adv[rows.length-1]=[M[n].badv];};
  rows.push('');sp(`назад + ${l('p2')} — оверхед (О), отскок`,'smash');rows.push('удары в прыжке — оверхед (О)');
  if(ch.cp)sp(`${l('d')} + ${l('p1')}/${l('p2')} — удар рукой сидя`,ch.cp);else sp(`${l('d')} + ${l('p1')}/${l('p2')} — апперкот ↑`,'upper');sp(`${l('d')} + ${l('k1')}/${l('k2')} — подсечка`,'sweep');rows.push('');
  if(ch.spn){rows.push(`${l('s')} — ${ch.spn.n}`);sp(`${l('d')} + ${l('s')} — ${ch.spn.d}`,cs.d);sp(`назад + ${l('s')} — ${ch.spn.b}`,cs.b);}
  else{sp(`${l('s')} — таран ↑`,'ram');sp(`${l('d')} + ${l('s')} — подъём ↑↑`,'rise');sp(`назад + ${l('s')} — лягание →`,'mule');}
  if(cs.g)rows.push(ch.rave?`${l('g')} по подброшенному — воздушная серия`:`${l('g')} — захват в воздухе, об пол ×3`);
  rows.push(
    `${l('g')} вблизи — бросок (выход — ${l('g')})`,
    `${l('run')} + назад — отскок`);
  rows.adv=adv;
  return rows;
}
const kbLine=i=>{const k=KEYS[i];return`${kn(k.l)} / ${kn(k.r)} · ${kn(k.u)} прыжок · ${kn(k.d)} присед · ${kn(k.p1)} рука 1 · ${kn(k.p2)} рука 2 · ${kn(k.k1)} нога 1 · ${kn(k.k2)} нога 2 · ${kn(k.blk)} блок · ${kn(k.run)} бег · ${kn(k.s)} спец · ${kn(k.g)} захват`;};
const padLine=()=>{const t=padType(pads()[0]),m=PADMAP[t],n=a=>pn(m[a],t);return`${n('p1')} рука 1 · ${n('p2')} рука 2 · ${n('k1')} нога 1 · ${n('k2')} нога 2 · ${n('blk')} блок · ${n('run')} бег · ${n('s')} спецприём · ${n('g')} захват · крестовина / стик`;};

// ---------- звук ----------
let ac=null;
function audioInit(){
  if(!ac){try{ac=new AudioContext();loadAudio();}catch(e){}}
  else if(ac.state==='suspended')ac.resume().catch(()=>{});
  musicSync();
}
// музыка локации: зациклена, M — выключить / включить
const MUSIC=new Audio('assets/audio/music_bar.mp3');MUSIC.loop=true;MUSIC.volume=.28;
const MUSIC_SEL=new Audio('assets/audio/music_select.mp3');MUSIC_SEL.loop=true;MUSIC_SEL.volume=.32;
const MUSIC_MENU=new Audio('assets/audio/music_menu.mp3');MUSIC_MENU.loop=true;MUSIC_MENU.volume=.32;
let musicOff=false;
// в меню, на экране выбора бойца и в бою — своя музыка
function musicSync(){
  if(!ac)return;
  const on=G.phase==='select'?MUSIC_SEL:G.phase==='menu'||G.phase==='net'||G.phase==='keys'?MUSIC_MENU:MUSIC;
  for(const m of[MUSIC,MUSIC_SEL,MUSIC_MENU])if(m!==on&&!m.paused)m.pause();
  if(musicOff){if(!on.paused)on.pause();}
  else if(on.paused){if(on!==MUSIC)on.currentTime=0;on.play().catch(()=>{});}
}
// сэмплы: в каждом файле несколько звуков подряд — играется кусок [файл, начало, конец] в секундах.
// v_* — голос HorseMan: atk — удар, sp — спецприём, hurt — получил удар, ko — нокаут, win — победа
const SAMP={
  hit:[['hit1',2.01,2.31],['hit1',3.21,3.48],['hit1',4.58,4.92],['hit1',5.77,6.02],['hit1',7.45,7.81],['hit2',.48,.72],['hit2',3.19,3.39],['hit2',6.14,6.37]],
  whoosh:[['whoosh1',.17,.36],['whoosh1',1.68,1.79],['whoosh1',3.73,3.82],['whoosh1',5.69,5.8],['whoosh1',6.77,6.88]],

function samp(kind,vol=1,rate=1,idx){
  if(!ac)return false;
  const list=SAMP[kind].filter(s=>BUFS[s[0]]);
  if(!list.length)return false;
  let i=idx!==undefined?idx%list.length:Math.random()*list.length|0;
  if(idx===undefined&&list.length>1&&i===lastS[kind])i=(i+1)%list.length; // один и тот же звук подряд не повторяется
  lastS[kind]=i;
  const[n,a,b,gain=1]=list[i],s=ac.createBufferSource(),g=ac.createGain();
  s.buffer=BUFS[n];s.playbackRate.value=rate;g.gain.value=vol*gain;s.connect(g);g.connect(ac.destination);
  s.start(0,Math.max(0,a-.02),b-a+.17);
  return true;
}

function snd(k){

    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);

    const b=ac.createBuffer(1,Math.max(1,ac.sampleRate*d|0),ac.sampleRate),a=b.getChannelData(0);

  else if(k==='block'){noise(.06,3500,.3);tone('square',300,200,.05,.08);}

// ---------- логика бойца ----------
// BUF — сколько кадров живёт нажатие; CANCEL_WIN — окно отмены после попадания; LOCK_PEN — штраф к восстановлению за сбой
const BUF=12,CANCEL_WIN=6,LOCK_PEN=6;
// промах: чем длиннее серия ушла в воздух, тем дольше боец открыт (по номеру удара в серии)
const SREC=[0,2,5,8,10];
function recov(f){
  const m=f.move;let r=m.rc+(f.locked?LOCK_PEN:0);
  if(!m.special&&!m.air&&f.seq&&!f.res)r+=SREC[Math.min(4,f.seq.split(',').length)];
  return r;
}
// преимущество в блоке: у серии своё (SADV), иначе — у удара (badv). Плюс — атакующий ходит первым, минус — открыт
const advOf=(seq,m,ch)=>{const t=(ch&&ch.sadv)||SADV;return seq&&t[seq]!==undefined?t[seq]:m.badv!==undefined?m.badv:-3;};
function breakString(f){if(!f.locked){f.locked=true;f.breakT=45;}}
// приём нажатий. Во время удара лишняя, неверная или запоздалая кнопка срывает серию.
function feed(f,inp){
  for(const b of BK){
    if(!inp[b])continue;
    if(b==='s')f.sDir=inp.g?'g':inp.d?'d':(f.facing>0?inp.l:inp.r)?'b':'n';
    if(f.state==='attack'&&!f.move.air){
      const m=f.move,total=m.su+m.ac+recov(f);
      if(f.at>=total-4){f.buf=newBuf();f.buf[b]=6;f.keepBuf=true;continue;} // под самый конец — ввод следующего удара
      if(!m.special){
        const pending=BK.some(k=>f.buf[k]>0);
        const closed=f.at>(f.contactAt>=0?f.contactAt:m.su+m.ac)+CANCEL_WIN; // мимо — окно открывается после активных кадров
        const ok=b==='s'||!!strOf(f)[f.seq+','+b];
        if(pending||closed||!ok)breakString(f);
      }
    }
    f.buf[b]=BUF;
  }
}
function startMove(f,name,seq){
  f.state='attack';f.move=M[name];f.mname=name;f.seq=seq||'';f.at=0;f.hitDone=false;f.contactAt=-1;f.res=0;
  f.locked=false;f.keepBuf=false;
  if(!f.move.air)f.vx=f.facing*(f.move.adv||0);
  f.buf=newBuf();f.running=false;snd('swing');
  if(f.move.dmg)voice(f,f.move.special?'v_sp':'v_atk',f.move.special||f.move.heavy?1:.3);
}
function trySpecial(f,o,inp){
  if(f.energy<SP_COST&&!(f.sDir==='g'&&o.y>=GY))return false;
  const sp=f.ch.sp||{n:f.ch.special,d:'rise',b:'mule'};
  if(f.sDir==='g'&&o.y>=GY){ // L2 по стоящему — бросок, шкалу не тратит
    f.facing=o.x>=f.x?1:-1;f.crouching=false;startMove(f,'throw','');return true;
  }
  const face=o.x>=f.x?1:-1,name=sp[f.sDir||'n']||sp.n; // направление запоминается в момент нажатия
  if(o.state==='hit'&&f.usedSp.includes(M[name].proj?'proj':name))return false; // каждый спецприём — раз за комбо
  f.facing=face;f.energy-=SP_COST;f.crouching=false;
  startMove(f,name,'');
  return true;
}
const vuln=o=>!['down','ko','win','grab','grabbed','throw','thrown'].includes(o.state)&&o.alpha>.6;

// ---------- одновременное применение попаданий ----------
let PEND=[];
function resolvePending(){
  const pend=PEND;PEND=[];
  const isG=h=>h.m.grab||h.m.throw?1:0;
  pend.sort((x,y)=>isG(x)-isG(y)); // удар бьёт захват
  for(const h of pend){
    const{a,d,m}=h;
    if(isG(h)){
      if(a.state!=='attack')continue; // захват сорван встречным ударом
      if(m.grab){if(vuln(d)&&d.y<GY)startGrab(a,d);}
      else if(throwable(d))startThrow(a,d);
    }else{
      resolveHit(a,d,m,a.facing,false,h.ender);
      if(m.rush&&a.state==='attack'){a.at=m.su+m.ac;a.vx=0;} // рывок останавливается на попадании
    }
  }
}

// ---------- бросок (L2 по стоящему): пробивает блок, проигрывает удару и прыжку, из него можно выйти ----------
// DMG — общий множитель урона: меньше урона за касание = больше разменов за раунд = результат зависит от игры, а не от одного попадания
const TECH_WIN=10,BREAK_COST=50,DMG=.72;
const DIFF=[['ЛЁГКИЙ',.35],['СРЕДНИЙ',.6],['СЛОЖНЫЙ',.8],['МАСТЕР',.95]];
function throwable(o){return o.y>=GY&&!o.tInv&&['idle','walk','crouch','block','attack'].includes(o.state);}
function startThrow(a,d){
  a.state='throw';a.thT=0;a.vx=0;a.buf=newBuf();
  d.state='thrown';d.vx=d.vy=0;d.crouching=false;d.facing=-a.facing;
  d.x=clamp(a.x+a.facing*52,AL,AR);
  hitstop=4;snd('block');
}
function techThrow(a,d){
  const dir=a.facing;
  for(const[f,s]of[[a,-dir],[d,dir]]){f.state='bstun';f.stateT=14;f.vx=s*8;f.buf=newBuf();f.crouching=false;f.tInv=10;}
  burst((a.x+d.x)/2,GY-110,'#ffffff',14,6);snd('block');hitstop=5;shake=Math.max(shake,5);
}
function doThrow(a,d){
  const dir=a.facing,dmg=12*a.ch.power*DMG;
  a.combo=1;a.comboDmg=dmg;a.comboT=110;a.usedSp=[];
  d.hp-=dmg;d.jug=0;d.usedWB=d.usedGB=d.wb=d.gbPending=d.usedDaze=false;d.dazeT=0;
  a.energy=Math.min(100,a.energy+4);d.energy=Math.min(100,d.energy+3);
  a.state='attack';a.mname='throwEnd';a.move=M.throwEnd;a.at=0;a.seq='';a.hitDone=true;a.contactAt=-1;a.locked=false;
  d.state='hit';d.stateT=30;d.flash=5;d.y=GY-1;d.vy=-8;d.vx=dir*7;d.launched=true;d.buf=newBuf();
  hitstop=6;shake=Math.max(shake,10);burst(d.x,GY-100,'#ffd24a',14);snd('hit');voice(d,'v_hurt');
  if(!a.cpu)rumble(a.i,true);

// две фазы (3 и 5 кнопок), после второй — добивание двумя руками об пол с высоким отскоком. Ошибка или опоздание — оба падают.
const RV={seq:[['k2','p1','k1'],['k2','k2','p1','k1','p2']],qt:[65,90],dmg:2.6,first:4,fin:9,an:{p1:'lbf',p2:'lhead',k1:'laxe',k2:'lknee'}};
function startRave(a,d){

    h:GY-a.y,h0:GY-a.y,h1:clamp(GY-d.y-10,120,185),dy0:d.y,dx0:d.x};

}
function ravePlace(a,d){

function endRave(a,d,full,ko){

  a.gr=null;a.facing=side;a.state='jump';a.vy=full?-6:0;a.vx=full?-side*2:0;a.airAtk=true;a.buf=newBuf();
  d.grabRot=undefined;d.facing=-side;d.launched=true;if(d.y>=GY)d.y=GY-2;
  if(ko){d.hp=0;d.state='ko';d.vy=6;d.vx=side*5;shake=16;endRound(a);return;}
  d.state='hit';d.stateT=30;
  if(full){d.vy=16;d.vx=side*1.5;d.usedGB=false;d.gbPending=true;} // добивание: об пол и высокий отскок — комбо можно продолжать
  else{d.vy=-4;d.vx=side*4;}
}
function raveHit(a,d,base,heavy){
  const g=a.gr,dmg=base*a.ch.power*Math.max(.15,1-.08*a.combo)*DMG;
  a.combo++;a.comboT=110;a.maxCombo=Math.max(a.maxCombo||0,a.combo);a.comboDmg+=dmg;
  d.hp-=dmg;d.flash=4;g.ht=9;g.jolt=7;

  burst(hx,hy,'#ffd24a',heavy?12:6);blood(hx,hy,g.side,heavy?28:12);snd('hit');voice(d,'v_hurt',heavy?1:.4);voice(a,'v_atk',heavy?1:.35);
  if(!a.cpu)rumble(a.i,heavy);

  if(d.hp<=0){if(G.mode===3)d.hp=1;else{endRave(a,d,false,true);return false;}}

}
function updRave(a,d){
  const g=a.gr;a.vx=0;g.t++;
  if(g.ht>0)g.ht--;

  if(g.phase==='rise'){ // взлёт к противнику, первый удар — без кнопок
    const k=Math.min(1,g.t/10),e=k*(2-k);
    g.h=g.h0+(g.h1-g.h0)*e;a.y=GY-g.h;
    d.x=clamp(g.dx0+(a.x+g.side*52-g.dx0)*e,AL-20,AR+20);d.y=g.dy0+(GY-g.h1-8-g.dy0)*e;d.facing=1;d.grabRot=-.3*g.side*e;
    if(k<1)return;
    if(!raveHit(a,d,RV.first))return;
    g.phase='qte';g.qi=0;g.qte=RV.seq[0];g.qt=g.qmax=RV.qt[0];
  }else if(g.phase==='qte'){
    g.h=Math.max(95,g.h-.3);ravePlace(a,d); // без ударов оба понемногу опускаются
    if(--g.qt<=0)endRave(a,d,false);
  }else if(g.phase==='gap'){ // пауза между фазами
    ravePlace(a,d);
    if(g.t>=14){g.n=1;d.jug++;g.phase='qte';g.qi=0;g.qte=RV.seq[1];g.qt=g.qmax=RV.qt[1];}
  }else{ // добивание
    ravePlace(a,d);
    if(g.t>=14&&raveHit(a,d,RV.fin,true))endRave(a,d,true);

function ravePress(a,d,inp){

    g.qi++;g.akey=RV.an[b];g.h=Math.min(215,g.h+6);
    if(!raveHit(a,d,RV.dmg))return;
    if(g.qi>=g.qte.length){g.t=0;if(g.n===0)g.phase='gap';else{g.phase='fin';g.akey='lhammer';}return;}
  }
}
function startGrab(a,d){

  if(d.state!=='hit'){a.combo=0;a.comboDmg=0;a.usedSp=[];d.jug=0;d.usedWB=d.usedGB=false;}

  a.gr={n:0,t:0,phase:'swing',side:a.facing,qte:null,qi:0,qt:0,qmax:1};
  d.state='grabbed';d.vx=d.vy=0;d.wb=d.gbPending=false;d.alpha=1;

// phi: 0 — лежит на полу со стороны side, PI/2 — над головой, PI — на полу с другой стороны
function grabPlace(a,d,phi,side){
  d.x=clamp(a.x+side*Math.cos(phi)*GR.R,AL-20,AR+20);
  d.y=Math.min(GY,GY-8-105*Math.sin(phi));

function endGrab(a,d,full,ko){
  const side=a.gr.side;
  a.gr=null;a.facing=side;
  a.state='attack';a.mname=full?'grabEnd':'grabFail';a.move=M[a.mname];a.at=0;a.seq='';a.hitDone=true;a.contactAt=-1;a.locked=false;a.buf=newBuf();
  d.grabRot=undefined;d.facing=-side;d.y=GY-2;d.launched=true;

  // все три удара — высокий отскок и можно продолжать комбо; сорвался — противник просто падает
  d.state='hit';d.stateT=30;d.vy=full?-13:-6;d.vx=side*(full?1.5:4);
}
function updGrab(a,d){
  const g=a.gr;a.vx=0;
  if(g.kind){updRave(a,d);return;}
  if(g.phase==='swing'){
    g.t++;
    const T=GR.sw[g.n],k=Math.min(1,g.t/T);
    grabPlace(a,d,Math.PI*(k*k*(3-2*k)*.35+k*k*k*.65),g.side); // разгон к удару
    if(g.t<T)return;
    g.n++;
    const dmg=GR.dmg[g.n-1]*a.ch.power*Math.max(.15,1-.08*a.combo)*DMG;
    a.combo++;a.comboT=110;a.maxCombo=Math.max(a.maxCombo||0,a.combo);a.comboDmg+=dmg;
    d.hp-=dmg;d.jug++;d.flash=5;
    const cx=clamp(a.x-g.side*100,AL-10,AR+10);
    hitstop=7;shake=Math.max(shake,11+g.n*3);
    burst(cx,GY,'#cfcfcf',18,7);blood(cx,GY-14,a.facing,26);snd('hit');snd('fall');voice(d,'v_hurt');voice(a,'v_atk');
    if(!a.cpu)rumble(a.i,true);
    if(!d.cpu&&!d.dummy)rumble(d.i,true);
    g.side=-g.side;a.facing=g.side; // следующий замах — в обратную сторону
    if(d.hp<=0&&G.mode!==3){endGrab(a,d,false,true);return;}
    if(d.hp<=0)d.hp=1;
    if(g.n>=3){endGrab(a,d,true);return;}
    g.phase='qte';g.qi=0;g.qt=g.qmax=GR.qt[g.n];
    g.qte=(a.ch.gseq||GR.seq)[g.n].slice(); // последовательности постоянные — их заучивают
  }else if(--g.qt<=0)endGrab(a,d,false);
}
// кнопки для следующего удара об пол: по порядку, ошибка — срыв
function qtePress(a,d,inp){
  const g=a.gr;
  if(a.state!=='grab'||!g||g.phase!=='qte')return;
  if(g.kind){ravePress(a,d,inp);return;}
  for(const b of BTN){
    if(!inp[b])continue;
    if(b!==g.qte[g.qi]){endGrab(a,d,false);return;}
    g.qi++;snd('block');

// up — запас по высоте: по подброшенному противнику удары достают выше
function hitbox(f,up=0){const m=f.move;return{x:f.facing>0?f.x:f.x-m.reach,y:f.y-m.y1-up,w:m.reach,h:m.y1-m.y0+up};}
function hurtbox(f){
  // просто сидящий ниже верхних ударов (они проходят над головой); в блоке сидя верхние принимаются на блок
  const low=(f.crouching&&f.state==='crouch')||(f.state==='attack'&&f.move&&f.move.crouch);
  const h=low?120:f.crouching&&(f.state==='block'||f.state==='bstun')?150:172;

const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

// брызги крови: летят по направлению удара, падают на пол и остаются пятнами, которые постепенно исчезают
const BLOOD=['#c0182a','#9a0f1f','#e02a3a','#7a0c18'];
function blood(x,y,dir,n){
  for(let i=0;i<n;i++){

    parts.push({x,y,vx:dir*Math.cos(a)*s*(Math.random()<.2?-.4:1),vy:Math.sin(a)*s-2.5,life:90,col:BLOOD[Math.random()*4|0],

function burst(x,y,col,n,sp=6){

function resolveHit(a,d,m,dir,isProj,ender){
  const rem=isProj?14:m.air?13:m.su+m.ac+m.rc-a.at; // сколько атакующему ещё восстанавливаться
  // блок стоя: верх, середина, оверхед; блок сидя: верх, середина, низ. Низ бьёт стоячий блок, оверхед и удары в прыжке — сидячий
  const guarding=(d.state==='block'||d.state==='bstun')&&d.facing===-dir&&d.y>=GY;
  const canBlock=guarding&&(m.type==='low'?d.crouching:m.type==='over'?!d.crouching:true);
  const hx=d.x-dir*22,hy=d.y-clamp((m.y0+m.y1)/2,20,160);
  if(guarding&&!canBlock){d.msg=m.type==='low'?'НИЗ!':'ОВЕРХЕД!';d.msgC='';d.msgT=frame+45;}
  if(!canBlock){d.hitLv=m.type==='low'?'low':m.type==='mid'?'mid':'high';d.anKey=null;}
  if(!isProj)a.res=1;
  if(canBlock){
    // преимущество в блоке у каждого удара и серии своё: одни дают плюс, после других боец открыт
    const adv=advOf(isProj?'':a.seq,m,a.ch);
    d.state='bstun';d.stateT=Math.max(3,rem+adv);d.vx=dir*5;
    if(G.mode===3&&!isProj){a.msg=(adv>0?'+':adv<0?'−':'')+Math.abs(adv)+' в блоке';a.msgC=advCol(adv);a.msgT=frame+50;}
    d.hp=Math.max(1,d.hp-(m.chip||0));
    a.energy=Math.min(100,a.energy+1);d.energy=Math.min(100,d.energy+2);
    if(!isProj)a.vx-=dir*2;
    burst(hx,hy,'#cfe0ff',6,4);snd('block');hitstop=3;return;
  }
  // комбо считается, пока жертва не вышла из оглушения
  if(d.state!=='hit'){a.combo=0;a.comboDmg=0;a.usedSp=[];d.jug=0;d.usedWB=d.usedGB=d.wb=d.gbPending=d.usedDaze=false;}
  d.dazeT=0;
  if(m.special)a.usedSp.push(isProj?'proj':a.mname);
  a.combo++;a.comboT=110;a.maxCombo=Math.max(a.maxCombo||0,a.combo);
  const scale=Math.max(.15,1-.08*(a.combo-1)),dmg=m.dmg*a.ch.power*scale*DMG;
  d.hp-=dmg;a.comboDmg+=dmg;
  a.energy=Math.min(100,a.energy+4);d.energy=Math.min(100,d.energy+3); // шкала копится только действиями
  const air=d.y<GY,atWall=d.x<=AL+2||d.x>=AR-2;
  // на земле оглушение на кадр короче восстановления атакующего: без отмены продолжить нельзя (минус 1)
  d.state='hit';d.stateT=isProj||m.air?m.stun:Math.max(5,rem-1);d.flash=4;d.alpha=1;d.launched=air;
  if(air)d.jug++;
  let decay=m.special?1:Math.max(.45,1-.05*d.jug);
  if(a.ch.cap&&a.combo>a.ch.cap)decay*=m.special?.5:.25; // потолок комбо бойца: дальше противник почти не подлетает // чем дольше джаггл, тем ниже подбрасывает; спецприёмы — в полную силу
  d.vx=dir*(air&&!m.wall?(m.akb!==undefined?m.akb:Math.min(m.kb,2.5)):m.kb);
  if(m.gb&&!d.usedGB){
    if(air){d.vy=14;d.gbPending=true;}else{d.vy=-12;d.y-=1;d.usedGB=true;}
  }else if(m.launch){d.vy=-m.launch*decay*clamp(1-(GY-d.y)/500,.55,1);if(!air)d.y-=1;} // чем выше висит, тем слабее подброс
  else if(air)d.vy=-(m.pop||3.6)*decay; // удар в воздухе лишь придерживает: без подброса противник опускается
  else if(m.daze&&!air&&!d.usedDaze){ // ошеломление: стоит и шатается, без сбивания с ног
    d.usedDaze=true;d.dazeT=d.stateT=m.daze;d.vx=dir*1.5;d.msg='ОШЕЛОМЛЁН!';d.msgC='#ffd24a';d.msgT=frame+45;
  }
  else if(ender){d.vy=-5.5;d.y-=1;d.vx=dir*6;} // последний удар серии сбивает с ног
  if(m.wall&&!d.usedWB)d.wb=true;
  if(atWall&&!air&&!isProj)a.vx-=dir*m.kb*.8;
  const heavy=!!m.heavy||m.dmg>=9;
  hitstop=heavy?6:3;shake=Math.max(shake,heavy?9:3);
  burst(hx,hy,'#ffd24a',heavy?10:6);blood(hx,hy,dir,heavy?30:16);snd('hit');
  voice(d,'v_hurt',heavy?.9:.45);
  if(!d.cpu&&!d.dummy)rumble(d.i,heavy);
  if(!a.cpu&&!a.dummy)rumble(a.i,heavy);
  if(d.hp<=0){
    if(G.mode===3)d.hp=1;
    else{d.hp=0;d.state='ko';d.vy=-10;d.vx=dir*6;if(d.y>=GY)d.y-=1;shake=16;endRound(a);}
  }
}

function updF(f,o,inp){
  if(G.mode===3)f.energy=Math.min(100,f.energy+2);
  if(f.tInv>0)f.tInv--;
  if(f.bdCd>0)f.bdCd--;
  if(f.flash>0)f.flash--;
  if(f.breakT>0)f.breakT--;
  if(f.comboT>0&&--f.comboT===0)f.combo=0;
  f.hpLag+=(f.hp-f.hpLag)*.06;
  feed(f,inp);
  for(const b of BK)if(!inp[b]&&f.buf[b]>0)f.buf[b]--;
  if(f.state==='thrown'){if(f.buf.s>0&&inp.g&&o.state==='throw')techThrow(o,f);return;} // выход из броска — L2 в окне
  if(f.state==='throw'){f.vx=0;if(++f.thT>TECH_WIN)doThrow(f,o);return;}
  if(f.state==='grabbed')return; // положением управляет тот, кто держит
  if(f.state==='grab'){qtePress(f,o,inp);if(f.state==='grab')updGrab(f,o);return;}
  const ground=f.y>=GY,anyP=f.buf.p1>0||f.buf.p2>0,anyK=f.buf.k1>0||f.buf.k2>0;

  if(FREE.includes(f.state)){
    if(ground){
      f.facing=o.x>=f.x?1:-1;f.airAtk=false;
      f.running=false;
      if(f.buf.s>0&&!inp.blk&&trySpecial(f,o,inp)){}
      else if(inp.blk){f.state='block';f.crouching=!!inp.d;f.vx=0;}
      else if(inp.d){
        f.state='crouch';f.crouching=true;f.vx=0;
        if(anyP)startMove(f,f.ch.cp||'upper');else if(anyK)startMove(f,'sweep');
      }else{
        f.crouching=false;
        const dir=(inp.r?1:0)-(inp.l?1:0);
        f.running=!!inp.run&&dir===f.facing; // бег только вперёд
        f.vx=dir*f.ch.speed*(f.running?1.75:dir===f.facing?1:.8);
        f.state=dir?'walk':'idle';
        if(dir)f.walkT+=(f.running?.36:.22)*dir*f.facing;
        const b=BTN.find(b=>f.buf[b]>0);
        if(b==='p2'&&dir===-f.facing)startMove(f,'smash','');
        else if(b)startMove(f,strOf(f)[b],b);
        else if(inp.run&&dir===-f.facing&&!f.bdCd){ // отскок назад: уходит от броска, но 16 кадров открыт для удара
          startMove(f,'backdash','');f.vx=-f.facing*11;f.bdCd=34;f.tInv=12;
        }else if(inp.u){f.vy=-15.5;f.vx=dir*f.ch.speed*(f.running?1.6:1.15);f.state='jump';f.y-=1;snd('jump');}
      }
    }else{
      f.state='jump';
      if(!f.airAtk&&(anyP||anyK)){f.airAtk=true;startMove(f,anyP?'jpunch':'jkick');}
    }
  }else if(f.state==='attack'){
    let m=f.move;
    // отмена только по попаданию и только в окне CANCEL_WIN: следующий удар серии или спецприём
    // отмена в следующий удар серии: по попаданию — сразу, мимо — после активных кадров (серией можно сближаться).
    // Спецприём в серию вставляется только по попаданию.
    const hitC=f.contactAt>=0,c0=hitC?f.contactAt:m.su+m.ac;
    if(!m.air&&!m.special&&!f.locked&&f.at>=c0&&f.at<=c0+CANCEL_WIN){
      if(f.buf.s>0){if(!hitC||!trySpecial(f,o,inp)){f.buf.s=0;breakString(f);}}
      else{
        const b=BTN.find(b=>f.buf[b]>0),nx=b&&strOf(f)[f.seq+','+b];
        if(nx){f.facing=o.x>=f.x?1:-1;startMove(f,nx,f.seq+','+b);}
      }
      m=f.move;
    }
    f.at++;
    if(m.air){
      if(ground){f.state='idle';f.vx=0;}
    }else{
      if(m.rush)f.vx=(f.at>m.su&&f.at<=m.su+m.ac)?f.facing*m.rush:f.vx*.7;
      else f.vx*=m.fr||.72;
      if(f.mname==='blink')f.alpha=f.at<m.su?1-f.at/m.su:Math.min(1,(f.at-m.su)/m.rc);
      if(f.at===m.su){
        if(f.mname==='proj'||m.proj){
          projs.push({x:f.x+f.facing*50,y:f.y-(m.proj||112),vx:f.facing*f.ch.pv,owner:f,col:f.ch.pc,spr:f.ch.psheet,t0:frame});if(!m.proj||!samp('l_spit',.7))snd('proj');
        }else if(f.mname==='blink'){
          burst(f.x,f.y-90,f.ch.accent,14,5);
          const side=o.x>=f.x?1:-1;
          f.x=clamp(o.x+side*85,AL,AR);f.facing=o.x>=f.x?1:-1;
          burst(f.x,f.y-90,f.ch.accent,14,5);snd('proj');
        }
      }
      if(f.at>=m.su+m.ac+recov(f)){
        f.state=m.crouch?'crouch':'idle';f.alpha=1;
        if(!f.keepBuf)f.buf=newBuf(); // нажатия, сделанные во время удара, в нейтраль не переносятся
        f.keepBuf=false;
      }
    }
    if(f.state==='attack'&&(m.dmg||(m.grab&&o.y<GY)||(m.throw&&throwable(o)))&&!f.hitDone&&G.phase==='fight'&&f.at>=m.su&&f.at<m.su+m.ac&&vuln(o)&&overlap(hitbox(f,o.state==='hit'&&o.y<GY&&!m.air?70:0),hurtbox(o))){
      // попадание откладывается: оба бойца сначала делают ход, потом удары применяются одновременно (честный размен)
      f.hitDone=true;f.contactAt=f.at;
      PEND.push({a:f,d:o,m,ender:!!f.seq&&!BTN.some(b=>strOf(f)[f.seq+','+b])});
    }
  }else if(f.state==='hit'){
    f.stateT--;if(f.dazeT>0)f.dazeT--;
    if(f.y<GY)f.dazeT=0;
    if(ground){
      f.vx*=.82;
      if(f.launched){
        if(f.gbPending){
          f.gbPending=false;f.usedGB=true;f.vy=-12;f.y=GY-1;f.vx*=.4;
          shake=Math.max(shake,8);burst(f.x,GY,'#bbbbbb',10,5);snd('fall');
        }else{f.state='down';f.stateT=G.mode===3?24:38;f.launched=false;f.vx*=.5;snd('fall');}
      }else if(f.stateT<=0){f.state='idle';f.tInv=8;}
    }else f.launched=true;
  }else if(f.state==='bstun'){f.vx*=.8;if(--f.stateT<=0){f.state='block';f.tInv=8;}}
  else if(f.state==='down'){
    // вставание: зажатое направление — перекат в эту сторону
    if(f.stateT<=16&&(inp.l||inp.r)&&G.mode!==3)f.vx=(inp.r?1:-1)*5.5;else f.vx*=.8;
    if(--f.stateT<=0){f.state='idle';f.tInv=8;}
  }
  else if(f.state==='ko'){if(ground)f.vx*=.85;}
  else if(f.state==='win'){f.vx=0;}

  const g=f.state==='hit'?.8*(1+.05*(f.jug||0)):.8;
  if(f.y<GY||f.vy<0){f.vy+=g;f.y+=f.vy;if(f.y>=GY){f.y=GY;f.vy=0;}}
  f.x+=f.vx;
  if(f.x<AL||f.x>AR){
    if(f.state==='hit'&&f.wb){ // отскок от стены
      const s=f.x<AL?1:-1;
      f.vx=s*Math.max(4,Math.abs(f.vx)*.35);f.vy=-11;if(f.y>=GY)f.y=GY-1;
      f.wb=false;f.usedWB=true;f.launched=true;
      shake=Math.max(shake,10);burst(f.x,f.y-90,'#ffffff',12,5);snd('fall');
    }
    f.x=clamp(f.x,AL,AR);
  }
  // край экрана: дальше, чем на экран, бойцы не расходятся (стена с отскоком — только край арены)
  if(f.state!=='grabbed'&&f.state!=='thrown')f.x=clamp(f.x,o.x-SPAN,o.x+SPAN);
}

function targetPose(f){
  switch(f.state){
    case'idle':return{...P.idle,t:.1+.025*Math.sin(frame*.08+f.i)};
    case'walk':{
      const s=Math.sin(f.walkT),k=f.running?.8:.5;
      return{...P.idle,t:f.running?.38:.1,lf:[.1+k*s,-.45-(f.running?.4*Math.max(0,-s):0)],lb:[-.05-k*s,-.4-(f.running?.4*Math.max(0,s):0)]};
    }
    case'crouch':return P.crouch;
    case'jump':return P.jump;
    case'block':case'bstun':return f.crouching?P.cblock:P.block;
    case'attack':{const m=f.move;return(m.air||f.at<=m.su+m.ac+2)?P[m.pose]:(m.crouch?P.crouch:P.idle);}
    case'hit':return f.y<GY?P.fall:f.dazeT>0?{...P.idle,t:.1+Math.sin(frame*.13)*.25}:P.hit;
    case'down':return P.ko;
    case'ko':return f.y<GY?P.fall:P.ko;
    case'grab':return f.gr&&f.gr.phase==='swing'?P.upper:P.hammer;
    case'grabbed':case'thrown':return P.hit;
    case'throw':return P.hook;
    case'win':return P.win;
  }
  return P.idle;
}

// ---------- ИИ ----------
// ИИ играет по тем же правилам, что и человек: серии по попаданию, джагглы, спецприёмы, блок, наказания, броски.
// ai.skill 0..1 — реакция, точность исполнения, угадывание низ/верх.
const AI_STR=[['p2','p1','p2'],['p2','p1','k1'],['p1','p1','p2','k1'],['k2','k2','p1','p2'],['p1','k2','p2'],['p1','p1','k2','k1'],['k2','p1','p2'],['k1','k1']];
const AI_JUG=[['p1','p1','p2','k1'],['k2','k2','p1','p2'],['p1','p1','k2','k1'],['p2','p1','p2']];
function aiInput(f,o){
  const ai=f.ai,inp={},R=Math.random,sk=ai.skill===undefined?.75:ai.skill;
  const dx=o.x-f.x,dist=Math.abs(dx),fw=dx>0?'r':'l',bk=dx>0?'l':'r';
  const pick=a=>a[R()*a.length|0];
  if(f.state==='grab'){ // кнопки для ударов об пол
    const g=f.gr;
    if(g&&g.phase==='qte'&&--ai.t<=0){ai.t=5+(R()*6|0);inp[R()<.75+.24*sk?g.qte[g.qi]:pick(BTN)]=1;}
    return inp;
  }
  if(f.state==='thrown'){ // выход из броска
    if(ai.tech===undefined)ai.tech=R()<.15+.35*sk;
    if(ai.tech&&o.thT>=5){inp.s=1;inp.g=1;}
    return inp;
  }
  ai.tech=undefined;
  if(f.state==='hit'){
    return inp;
  }
  if(f.state==='down'){ // вставание с перекатом
    if(ai.roll===undefined)ai.roll=pick(['',fw,bk]);
    if(ai.roll)inp[ai.roll]=1;
    return inp;
  }
  ai.roll=undefined;
  if(f.state==='attack'){
    const m=f.move,key=f.mname+'|'+f.seq;
    if(ai.key!==key){ai.key=key;ai.done=false;}
    if(!ai.done&&f.contactAt>=0&&!m.special&&!m.air){
      ai.done=true;
      const hit=o.state==='hit',n=f.seq?f.seq.split(',').length:0,next=ai.plan&&ai.plan[n];
      const exec=R()<.6+.39*sk; // ошибка исполнения
      const cs=f.ch.sp||{n:'ram',d:'rise',b:'mule'},sps=[[cs.n,{}],[cs.d,{d:1}],[cs.b,{[bk]:1}]].filter(s=>!f.usedSp.includes(M[s[0]].proj?'proj':s[0]));
      if(hit&&exec){
        if(f.energy>=SP_COST&&(!next||R()<.15)&&R()<.3+.6*sk){
          if(o.y<GY-30&&cs.g&&!f.usedSp.includes('grab')&&R()<.4){inp.s=1;inp.g=1;}
          else if(sps.length){inp.s=1;Object.assign(inp,pick(sps)[1]);}
          else if(next)inp[next]=1;
        }else if(next)inp[next]=1;
      }else if(!hit&&next&&R()<.5)inp[next]=1; // давление по блоку
    }
    return inp;
  }
  if(f.y<GY){ // в прыжке: по прыгающему — рукой, по стоящему — ногой
    if(o.y<GY-40&&o.state!=='hit'&&dist<100&&!f.airAtk&&R()<.4)inp.p1=1;
    else if(dist<110&&f.vy>2&&!f.airAtk&&R()<.5)inp.k2=1;
    return inp;
  }
  // защита
  const om=o.state==='attack'?o.move:null;
  const threat=om&&om.dmg&&o.at<=om.su+om.ac&&dist<om.reach+(om.rush?200:60);
  if(threat){
    const id=o.mname+'|'+o.seq;
    if(ai.did!==id){
      ai.did=id;
      const react=f.state==='bstun'||f.state==='block'?.9:.45+.5*sk; // первый удар заблокировать сложнее
      if(R()<react){
        // по умолчанию блок сидя (держит всё, кроме оверхеда); на оверхед и удар в прыжке надо встать
        let cr=om.type!=='over';
        if(om.type==='over'?R()>.3+.65*sk:om.type==='low'&&R()>.6+.4*sk)cr=!cr; // не угадал низ/оверхед
        ai.def={blk:1,d:cr?1:0};
      }else ai.def=null;
    }
    if(ai.def){ai.bt=6;ai.lastDef=ai.def;return Object.assign(inp,ai.def);}
  }else ai.did=null;
  if(f.state==='bstun'||ai.bt>0){ai.bt--;return Object.assign(inp,ai.lastDef||{blk:1});}
  if(ai.t>0){ai.t--;return Object.assign(inp,ai.hold||{});}
  ai.hold={};
  // джаггл: добежать и начать серию
  if(o.state==='hit'&&o.dazeT>0&&o.y>=GY){
    if(dist>95){inp[fw]=1;inp.run=1;return inp;}
    if(R()<.5+.5*sk){ai.plan=pick(f.ch.ai||AI_STR);inp[ai.plan[0]]=1;}
    return inp;
  }
  if(o.state==='hit'&&o.y<GY){
    if(dist>100){inp[fw]=1;inp.run=1;return inp;}
    if(GY-o.y<215&&R()<.5+.5*sk){ai.plan=pick(f.ch.aij||AI_JUG);inp[ai.plan[0]]=1;}
    return inp;
  }
  // наказание промаха или небезопасного удара
  if(om&&o.at>=om.su+om.ac&&!om.air){
    const left=om.su+om.ac+om.rc-o.at;
    if(left>=5&&R()<.3+.7*sk){
      if(dist<100){ai.plan=(f.ch.ai||AI_STR)[0];inp[ai.plan[0]]=1;return inp;}
      if(left>12){inp[fw]=1;inp.run=1;return inp;}
    }
  }
  // антиэйр
  if(o.y<GY&&o.state!=='hit'&&dist<140&&o.vy>-2){
    if(R()<.3+.6*sk){if(dist<95&&GY-o.y<150){inp.d=1;inp.p1=1;ai.plan=null;}}
    else inp.blk=1;
    return inp;
  }
  if(o.state==='down'){ // ждём вставания рядом
    if(dist>105){inp[fw]=1;return inp;}
    if(o.stateT>6)return inp;
  }
  const r=R();
  if(dist>100){
    if(r<.06){ai.hold={[fw]:1,u:1};ai.t=3;}
    else if(r<.7){ai.hold={[fw]:1,run:dist>260?1:0};ai.t=5+(R()*8|0);}
    else if(r<.85){ai.hold={[bk]:1};ai.t=6+(R()*8|0);}
    else ai.t=5+(R()*10|0);
    return Object.assign(inp,ai.hold);
  }
  const oBlk=o.state==='block'||o.state==='bstun';
  if(oBlk&&o.crouching&&R()<.12+.2*sk){inp[bk]=1;inp.p2=1;ai.plan=null;ai.t=2;return inp;} // оверхед по сидящему в блоке
  if(r<(oBlk?.35:.1)){inp.s=1;inp.g=1;ai.t=4;return inp;} // бросок, особенно против блока
  if(r<.78){ai.plan=pick(f.ch.ai||AI_STR);inp[ai.plan[0]]=1;ai.t=2;return inp;}
  if(r<.88){ai.hold={blk:1};ai.t=8+(R()*10|0);}
  else{ai.hold={[bk]:1,run:R()<.5?1:0};ai.t=8+(R()*8|0);} // отход или отскок
  return Object.assign(inp,ai.hold);
}

// ---------- мир ----------
function world(live){
  if(hitstop>0){
    hitstop--;
    // нажатия во время стоп-кадра не теряются
    if(live)F.forEach((f,i)=>{if(!f.cpu&&!f.dummy&&!(TUT.demo&&i===0&&G.mode===3)){feed(f,IN[i]);qtePress(f,F[1-i],IN[i]);}});
  }else{
    const ins=F.map((f,i)=>!live?EMPTY:TUT.demo&&i===0&&G.mode===3?tutorInput(f,F[1]):f.dummy?DUMMY_IN[G.dummy||0]:f.cpu?aiInput(f,F[1-i]):IN[i]);
    const k=frame&1; // порядок хода чередуется каждый кадр — ни у одной стороны нет преимущества
    updF(F[k],F[1-k],ins[k]);updF(F[1-k],F[k],ins[1-k]);
    resolvePending();
    const a=F[0],b=F[1],out=['ko','down','grab','grabbed','throw','thrown'];
    if(Math.abs(a.y-b.y)<110&&!out.includes(a.state)&&!out.includes(b.state)&&a.alpha>=1&&b.alpha>=1){
      const d=b.x-a.x,ov=56-Math.abs(d);
      if(ov>0){const s=d>=0?1:-1;a.x=clamp(a.x-s*ov/2,AL,AR);b.x=clamp(b.x+s*ov/2,AL,AR);}
    }
    for(const p of projs){
      p.x+=p.vx;
      if(frame%2===0&&!p.spr)parts.push({x:p.x,y:p.y,vx:-p.vx*.2,vy:(Math.random()-.5)*2,life:12,col:p.col,size:4});
      const o=F[1-p.owner.i],hb=hurtbox(o);
      if(G.phase==='fight'&&vuln(o)&&p.x>hb.x-12&&p.x<hb.x+hb.w+12&&p.y>hb.y&&p.y<hb.y+hb.h){
        p.dead=true;resolveHit(p.owner,o,p.owner.ch.pm||PM,Math.sign(p.vx),true);
        if(p.spr)SPFX.push({x:p.x,y:p.y,dir:Math.sign(p.vx),spr:p.spr,t0:frame}); // брызги — только картинка
      }
      if(p.x<camX-30||p.x>camX+W+30)p.dead=true;
    }
    if(projs.length===2&&projs[0].owner!==projs[1].owner&&Math.abs(projs[0].x-projs[1].x)<24){
      burst((projs[0].x+projs[1].x)/2,projs[0].y,'#fff',16);projs[0].dead=projs[1].dead=true;snd('block');
    }
    projs=projs.filter(p=>!p.dead);
    for(const f of F)lerpPose(f.pose,targetPose(f),f.state==='attack'?.5:.3);
  }
  for(const p of parts){
    p.life--;
    if(p.st)continue;
    p.x+=p.vx;p.y+=p.vy;p.vy+=.35;
    if(p.bl&&p.vy>0&&p.y>=p.gy){p.st=1;p.y=p.gy;p.life=200+Math.random()*160;p.x=clamp(p.x,AL-40,AR+40);} // капля упала — пятно на полу
  }
  parts=parts.filter(p=>p.life>0);
  camX+=(camTarget()-camX)*.16; // камера плавно идёт за серединой между бойцами
  const lo=Math.max(F[0].x,F[1].x)-W+45,hi=Math.min(F[0].x,F[1].x)-45; // но никого не оставляет за краем экрана
  if(lo<=hi)camX=clamp(camX,lo,hi);
  camX=clamp(camX,0,WW-W);
}

function tick(net){
  frame++;
  // по сети ввод обоих игроков приходит готовым (одинаковый на обеих машинах), локально — с клавиатуры и геймпадов
  if(net){IN=net;PAD=[{start:net[0].start},{start:net[1].start}];}
  else{PAD=[padInput(0),padInput(1)];IN=[getInput(0),getInput(1)];}
  const padStart=!!(PAD[0].start||PAD[1].start);
  if(!net)musicKey();
  if(G.phase==='menu'){
    if(pressed.has('Digit1')||pressed.has('Numpad1')||PAD[0].fx){G.mode=1;toSelect();}
    else if(pressed.has('Digit2')||pressed.has('Numpad2')||PAD[0].fo){G.mode=2;toSelect();}
    else if(pressed.has('Digit3')||pressed.has('Numpad3')||PAD[0].ft){G.mode=3;G.sel=[GRID.includes(G.trainCh)?G.trainCh:GRID[0],0];snd('bell');startMatch();}
    else if(pressed.has('Digit4')||pressed.has('Numpad4')||PAD[0].fs){G.phase='net';NET.ui='';NET.msg='';snd('bell');}
    else if(pressed.has('Digit5')||pressed.has('Numpad5')||PAD[0].start){G.phase='keys';KS.tab=lastDev==='pad'?2:0;KS.row=0;KS.wait=false;KS.msg='';snd('bell');}
    return;
  }
  if(G.phase==='net'){netMenu();return;}
  if(G.phase==='keys'){keysMenu();return;}
  if(!net&&(pressed.has('Escape')||PAD[0].back||PAD[1].back)){G.phase='menu';return;}
  if(G.phase==='select'){
    for(let i=0;i<2;i++){
      if(i===1&&G.mode===1)continue;
      const n=IN[i];
      if(!G.ok[i]){
        const dx=(n.rE?1:0)-(n.lE?1:0),dy=dx?0:(n.dE?1:0)-(n.uE?1:0);
        if(dx||dy){const s=selMove(G.sel[i],dx,dy);if(s!==G.sel[i]){G.sel[i]=s;samp('ui_sel',.8,1,0);}}
        if(n.p1||n.p2||n.k1||n.k2||PAD[i].start||(!net&&i===0&&pressed.has('Enter'))){G.ok[i]=true;snd('bell');}
      }
    }
    if(G.mode===1&&!G.ok[0]){
      const b=(IN[0].blk?1:0)-(IN[0].run?1:0); // сложность — кнопками блока и бега (стрелки заняты сеткой)
      if(b&&!G.dPrev){G.diff=(G.diff+b+DIFF.length)%DIFF.length;samp('ui_sel',.6,1.2,0);}
      G.dPrev=b;
    }
    if(G.mode===1&&G.ok[0]&&!G.ok[1]){G.sel[1]=GRID[Math.random()*2|0];G.ok[1]=true;samp('ui_sel',.8,1,0);}
    if(G.ok[0]&&G.ok[1]&&++G.selT>40)startMatch();
    return;
  }
  G.t++;
  if(G.phase==='intro'){
    world(false);
    if(G.t>=70){G.phase='fight';G.t=0;snd('bell');}
  }else if(G.phase==='fight'){
    world(true);
    if(G.mode===3)training();
    else if(G.phase==='fight'&&--G.timer<=0){
      const a=F[0],b=F[1];
      endRound(a.hp>b.hp?a:b.hp>a.hp?b:null,true);
    }
  }else if(G.phase==='ko'){
    if(!G.timeout&&G.t<60&&G.t%3)return; // замедление на нокауте
    world(false);
    const w=G.winner;
    if(G.t>60&&w&&w.y>=GY&&FREE.includes(w.state)){w.state='win';voice(w,'v_win');}
    if(G.t>200){
      if(F.some(f=>f.wins>=2)){G.phase='end';G.t=0;}
      else{G.round++;startRound();}
    }
  }else if(G.phase==='end'){
    world(false);
    if((!net&&pressed.has('Enter'))||padStart)startMatch();
  }
}
function toSelect(){G.phase='select';G.ok=[false,false];G.selT=0;snd('bell');}
// ---------- обучение комбо (тренировка) ----------

// бот-исполнитель: жмёт шаги комбо по порядку — следующую кнопку серии по попаданию, спецприём отменой, добегает до подброшенного
function tutorInput(f,o){
  const inp={},S=TUT.st,rc=tutList()[TUT.i].steps,fw=o.x>=f.x?'r':'l',bk=fw==='r'?'l':'r',dist=Math.abs(o.x-f.x);
  const spInp=c=>{inp.s=1;if(c==='@d')inp.d=1;else if(c==='@b')inp[bk]=1;else if(c==='@g')inp.g=1;};
  if(S.w>0)S.w--;
  if(f.state==='grab'){const g=f.gr;if(g&&g.phase==='qte'&&S.w<=0){S.w=6;inp[g.qte[g.qi]]=1;}return inp;}
  const cur=rc[S.k];
  if(f.state==='attack'){
    const key=f.mname+'|'+f.seq+'|'+S.k;
    if(cur&&cur[0]!=='@'&&f.contactAt>=0&&S.key!==key&&!f.move.special&&!f.move.air){
      S.key=key;
      if(f.seq===cur){ // серия закончена: следующий шаг — спецприём или захват — отменой
        S.k++;const nx=rc[S.k];
        if(nx&&nx[0]==='@'&&(nx!=='@g'||o.y<GY-30)){spInp(nx);S.k++;}
      }else if(cur.startsWith(f.seq+','))inp[cur.split(',')[f.seq.split(',').length]]=1;
    }
    return inp;
  }
  if(!FREE.includes(f.state)||f.y<GY)return inp;
  if(S.k>0&&o.state!=='hit'){TUT.demo=false;return inp;} // противник вышел из комбо — показ окончен
  if(!cur||S.w>0)return inp;
  if(cur==='@g'){
    if(dist>92){inp[fw]=1;inp.run=1;}else if(o.y<GY-30){spInp(cur);S.k++;S.w=8;}
  }else if(dist>(S.k&&o.y<GY?100:80)){inp[fw]=1;if(S.k)inp.run=1;} // по стоящему (ошеломлённому) — подойти ближе
  else if(cur[0]==='@'){spInp(cur);S.k++;S.w=8;}
  else if(!S.k||GY-o.y<215){inp[cur.split(',')[0]]=1;S.w=8;}
  return inp;
}

// ---------- игра по сети ----------
// Браузеры соединяются напрямую (WebRTC через PeerJS), сервер нужен только чтобы найти друг друга по коду комнаты.
// Схема «lockstep»: обе машины считают один и тот же бой и обмениваются только нажатиями. Свой ввод применяется
// с задержкой D кадров — за это время он успевает дойти до соперника, поэтому условия у обоих одинаковые.
// Раз в полсекунды сверяется контрольная сумма; при расхождении хозяин комнаты присылает своё состояние целиком.
const NET={on:false,me:0,f:0,D:3,next:0,loc:{},rem:{},sums:{},peer:null,conn:null,ui:'',code:'',msg:'',wait:0,ping:0,resync:0,lastSnap:-999,pings:[]};
const NK=['l','r','u','d','blk','run','g','p1','p2','k1','k2','s','uE','dE','lE','rE','start'];
const netPack=o=>NK.reduce((m,k,i)=>m|(o[k]?1<<i:0),0);
const netUnpack=m=>{const o={};NK.forEach((k,i)=>{o[k]=!!(m>>i&1);});return o;};
// свой ввод: первый геймпад и любая из двух клавиатурных раскладок
function netLocal(){
  PAD=[padInput(0,true),{}];
  const a=getInput(0),b=getInput(1),o={};
  for(const k of NK)o[k]=a[k]||b[k];
  o.start=!!PAD[0].start||pressed.has('Enter');
  pressed.clear();
  return netPack(o);
}
function netSum(){
  if(F.length<2)return G.selT+G.sel[0]*7+G.sel[1]*13;
  return Math.round(F[0].x*8)+Math.round(F[1].x*8)*3+Math.round(F[0].y*8)*5+Math.round(F[1].y*8)*7+
    Math.round(F[0].hp*100)*11+Math.round(F[1].hp*100)*13+G.timer*17+F[0].stateT*19+F[1].stateT*23;
}
function netSend(o){try{if(NET.conn&&NET.conn.open)NET.conn.send(o);}catch(e){}}
// один игровой кадр по сети; false — ждём ввод соперника (кадр не считается, игра стоит)
function netFrame(){
  const N=NET;
  musicKey();
  if(pressed.has('Escape')){netClose('');G.phase='menu';pressed.clear();return true;}
  let steps=N.rem[N.f+N.D+2]!==undefined?2:1; // отстали от соперника — догоняем двумя кадрами за раз
  while(steps--){
    while(N.next<=N.f+N.D){const v=netLocal();N.loc[N.next]=v;netSend({i:[N.next,v]});N.next++;}
    if(N.f>=N.D&&N.rem[N.f]===undefined){N.wait++;return false;}
    N.wait=0;
    const mine=netUnpack(N.loc[N.f]||0),his=netUnpack(N.rem[N.f]||0);
    tick(N.me?[his,mine]:[mine,his]);
    N.f++;
    if(N.f%30===0){
      const c=netSum();netSend({c:[N.f,c]});
      if(N.sums[N.f]!==undefined&&N.sums[N.f]!==c)netDesync();
      N.sums[N.f]=c;
      for(const k in N.loc)if(k<N.f-240)delete N.loc[k];
      for(const k in N.rem)if(k<N.f-240)delete N.rem[k];
      for(const k in N.sums)if(k<N.f-240)delete N.sums[k];
    }
  }
  return true;
}
function netDesync(){
  if(NET.me){netSend({need:1});return;}
  if(NET.f-NET.lastSnap<45)return;
  NET.lastSnap=NET.f;NET.resync++;
  netSend({snap:netSnap()});
}
// состояние боя целиком: ссылки на бойцов и удары заменяются номерами и именами
function netSnap(){
  return JSON.stringify({f:NET.f,frame,hitstop,camX,
    G:{...G,winner:G.winner?G.winner.i:null,log:undefined},
    F:F.map(f=>({...f,ch:CH.indexOf(f.ch),move:null})),
    projs:projs.map(p=>({...p,owner:p.owner.i}))});
}
function netApply(js){
  const s=JSON.parse(js);
  F=s.F.map(o=>{o.ch=CH[o.ch];o.move=M[o.mname]||null;return o;});
  Object.assign(G,s.G);G.winner=s.G.winner===null?null:F[s.G.winner];
  projs=s.projs.map(p=>{p.owner=F[p.owner];return p;});
  frame=s.frame;hitstop=s.hitstop;camX=s.camX;PEND=[];
  NET.f=s.f;NET.sums={};NET.resync++;
}
function netData(d){
  const N=NET;
  if(d.i)N.rem[d.i[0]]=d.i[1];
  else if(d.c){
    const[f,c]=d.c;
    if(N.sums[f]===undefined)N.sums[f]=c;      // до этого кадра ещё не дошли — сверим, когда дойдём
    else if(N.sums[f]!==c)netDesync();
  }
  else if(d.need){if(!N.me)netDesync();}
  else if(d.snap){if(N.me)netApply(d.snap);}
  else if(d.ping!==undefined)netSend({pong:d.ping});
  else if(d.pong!==undefined){
    N.pings.push(performance.now()-d.pong);
    if(N.pings.length<5)setTimeout(()=>netSend({ping:performance.now()}),60);
    else if(!N.on){
      N.ping=Math.round(Math.min(...N.pings));
      const D=clamp(Math.ceil(N.ping/2/STEP)+2,2,10); // задержка ввода = время доставки + запас
      netSend({start:[D,N.ping]});netBegin(D,0);
    }
  }
  else if(d.start){N.ping=d.start[1];netBegin(d.start[0],1);}
}
function netBegin(D,me){
  Object.assign(NET,{on:true,me,D,f:0,next:0,loc:{},rem:{},sums:{},wait:0,resync:0,lastSnap:-999});
  frame=0;hitstop=0;F=[];projs=[];parts=[];PEND=[];
  const hm=CH.findIndex(c=>c.name==='HORSEMAN');
  Object.assign(G,{mode:2,phase:'select',sel:[hm,hm],ok:[false,false],selT:0,t:0,round:1,winner:null,timeout:false});

  const N=NET;

function netLib(cb){
  if(window.Peer)return cb();
  NET.msg='Загрузка сетевой библиотеки…';
  const s=document.createElement('script');
  s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
  s.onload=()=>{NET.msg='';cb();};
  s.onerror=()=>{NET.ui='';NET.msg='Не удалось загрузить сетевую библиотеку — нужен интернет';};
  document.head.appendChild(s);
}
const NET_ID='nochnoy-turnir-';
function netWire(conn){
  NET.conn=conn;
  conn.on('data',netData);
  conn.on('close',()=>{if(NET.conn===conn)netClose('Соперник отключился');});
  conn.on('error',()=>{if(NET.conn===conn)netClose('Ошибка соединения');});
}
function netHost(){
  NET.ui='host';NET.code='';NET.msg='';
  netLib(()=>{
    const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code='';for(let i=0;i<5;i++)code+=A[Math.random()*A.length|0];
    const peer=NET.peer=new Peer(NET_ID+code);
    peer.on('open',()=>{NET.code=code;});
    peer.on('connection',conn=>{
      if(NET.conn){conn.close();return;} // комната на двоих
      netWire(conn);
      conn.on('open',()=>{NET.msg='Соперник подключился, замер связи…';NET.pings=[];netSend({ping:performance.now()});});
    });
    peer.on('error',e=>{
      if(e.type==='unavailable-id'){peer.destroy();netHost();}
      else if(!NET.on){NET.ui='';NET.msg='Сервер комнат недоступен: '+e.type;}
    });
  });
}
function netJoin(code){
  NET.ui='joining';NET.msg='Подключение к комнате '+code+'…';
  netLib(()=>{
    const peer=NET.peer=new Peer();
    peer.on('open',()=>{
      const conn=peer.connect(NET_ID+code,{reliable:true});
      netWire(conn);
      conn.on('open',()=>{NET.msg='Комната найдена, замер связи…';});
    });
    peer.on('error',e=>{
      if(NET.on)return;
      NET.ui='join';NET.msg=e.type==='peer-unavailable'?'Комната '+code+' не найдена — проверь код':'Не удалось подключиться: '+e.type;
    });
  });
}

const TH=44,SH=44,TO=60,UA=30,FA=30,OUT='#0b0b12';
// тень спрайтового бойца: тот же кадр, отражённый вниз от линии пола, чёрный и полупрозрачный
const SHD=[null,null];
function drawShadow(i){

  ctx.translate(f.x,GY+1);ctx.transform(f.facing,0,-.3,-.2,0,0);

}
function drawSprite(f){
  const c=f.ch,p=f.pose,sp=c.sprite,st=f.state;
  const blk=st==='block'||st==='bstun';
  const key=st==='attack'?(sp[f.mname]?f.mname:f.move.pose):st==='walk'&&f.running&&sp.run?'run':
    st==='hit'?(f.dazeT>0&&f.y>=GY?'daze':f.y<GY?'fall':f.crouching&&sp.chit?'chit':sp['hit_'+f.hitLv]?'hit_'+f.hitLv:'hit'):
    blk?(f.crouching&&sp.cblock?'cblock':'block'):st==='ko'?(f.y<GY?'fall':'down'):
    st==='grab'&&f.gr&&f.gr.kind?f.gr.akey:st==='grab'&&sp.slam?'slam':st==='throw'&&sp.throwHold?'throwHold':st;
  // смена анимации: отсчёт кадров с нуля; из приседа в присед (блок сидя, удар сидя) — без повторного приседания
  const lowNow=key==='crouch'||key==='cblock'||key==='chit'||(st==='attack'&&!!f.move.crouch);
  if(f.anKey!==key){
    f.anKey=key;f.anT0=frame;
    if(key==='cblock')f.cbIn=!f.anLow;
    if(key==='crouch'&&f.anLow)f.anT0=frame-999;
  }
  f.anLow=lowNow;
  const an=(key==='cblock'&&f.cbIn&&sp.cblock_in)||sp[key]||sp.idle,own=an!==sp.idle||st==='idle'||key==='daze'; // own — для состояния есть своя анимация
  if(!an.img.complete||!an.img.naturalWidth)return false;
  const img=(f.alt&&altImg(an))||an.img;
  const frozen=!own&&(st==='hit'||st==='down'||st==='ko'||st==='bstun');
  const fps=!own&&st==='walk'?(f.running?22:15):an.fps;
  const n=an.n||an.frames,t=frame-f.anT0;
  let fr=frozen?0:Math.floor(frame*fps/60+(f.i||0)*3)%n;
  if(own&&st==='attack'){
    const m=f.move,h=an.hit,post=n-1-h,rc0=m.su+m.ac+3;
    if(h===undefined)fr=Math.min(n-1,Math.floor(f.at/(m.su+m.ac+m.rc)*n));
    else if(f.at<m.su)fr=Math.floor(f.at/m.su*h);                     // замах
    else if(f.at<rc0)fr=h;                                            // удар
    else if(post)fr=h+1+Math.min(post-1,Math.floor((f.at-rc0)/Math.max(1,m.rc-3)*post)); // возврат
    else fr=m.air||f.at<rc0+(m.rc-3)*.6?h:0;
  }else if(key==='slam'){const g=f.gr;fr=g&&g.phase==='swing'&&GR.sw[g.n]?Math.min(n-1,Math.floor(g.t/GR.sw[g.n]*n)):n-1;}
  else if(st==='grab'&&f.gr&&f.gr.kind){const g=f.gr,h=an.hit||0;fr=g.phase==='fin'?Math.min(Math.max(0,h-1),Math.floor(g.t/14*h)):g.ht>0?h:Math.max(0,h-1);}
  else if(own&&an.cyc)fr=Math.floor((((f.walkT/6.283)%1)+1)%1*n);
  else if(own&&an.vy)fr=f.vy<-9?2:f.vy<-3?3:f.vy<4?4:5;
  else if(own&&an.once)fr=Math.min(n-1,Math.floor(t*an.fps/60));
  fr+=an.f0||0;
  // пока есть только idle: остальные состояния изображаются наклоном, приседом и следом удара
  const low=(f.crouching&&(st==='crouch'||st==='block'||st==='bstun'))||(st==='attack'&&f.move&&f.move.crouch);
  f.sq=(f.sq===undefined?1:f.sq)+((own?1:low?.66:st==='jump'?.92:1)-(f.sq===undefined?1:f.sq))*.35;
  const s=c.scale,w=an.cw*s,h=an.ch*s*f.sq;
  let lunge=0;
  if(!own&&st==='attack'&&f.move.dmg&&f.at>=f.move.su&&f.at<f.move.su+f.move.ac+3)lunge=12;
  SHD[f.i]=f.noShadow||st==='grabbed'?null:{f,img,sx:fr*an.cw,cw:an.cw,ch:an.ch,w,h,dx:-w/2+lunge,dy:-h+3*s};
  ctx.save();ctx.globalAlpha=f.alpha;
  if(own){ctx.translate(f.x+(st==='bstun'?(frame&2?1.5:-1.5):0),f.y);ctx.scale(f.facing,1);if(key==='daze'&&!sp.daze)ctx.rotate(Math.sin(frame*.13)*.07);} // своего листа нет — покачивание стойки
  else if(st==='grabbed'&&f.grabRot!==undefined){ctx.translate(f.x,f.y);ctx.scale(f.facing,1);ctx.rotate(-f.grabRot);}
  else{ctx.translate(f.x,f.y-p.rot*16);ctx.scale(f.facing,1);ctx.rotate(-p.rot+(p.t-.1)*.32);}
  if(f.flash>0)ctx.filter='brightness(4)';
  else if(!own&&(st==='block'||st==='bstun'))ctx.filter='brightness(.7)';
  ctx.drawImage(img,fr*an.cw,0,an.cw,an.ch,-w/2+lunge,-h+3*s,w,h);
  ctx.restore();
  if(!own&&st==='attack'&&f.move.dmg&&f.at>=f.move.su-1&&f.at<f.move.su+f.move.ac+2){
    const m=f.move,cy=f.y-(m.y0+m.y1)/2,x0=f.x+f.facing*30,x1=f.x+f.facing*m.reach;
    ctx.save();ctx.lineCap='round';
    for(const[lw,col]of[[Math.max(10,(m.y1-m.y0)*.45),'rgba(255,255,255,.35)'],[5,'rgba(255,240,180,.9)']]){

      ctx.quadraticCurveTo((x0+x1)/2,cy-14,x1,cy);ctx.stroke();
    }
    ctx.restore();
  }
  return true;
}
function drawF(f){
  if(f.ch.sprite&&drawSprite(f))return;

  const rot=f.state==='grabbed'&&f.grabRot!==undefined?f.grabRot:p.rot;
  ctx.translate(f.x,f.y-(rot===p.rot?p.rot*10:0));ctx.scale(f.facing,1);ctx.rotate(-rot);
  ctx.lineCap='round';ctx.lineJoin='round';
  const seg=(ox,oy,a,l1,l2)=>{
    const x1=ox+Math.sin(a[0])*l1,y1=oy+Math.cos(a[0])*l1,b=a[0]+a[1];
    return[ox,oy,x1,y1,x1+Math.sin(b)*l2,y1+Math.cos(b)*l2];
  };
  const l0=seg(0,0,p.lf,TH,SH),l1=seg(0,0,p.lb,TH,SH);
  const hipY=-Math.max(l0[5],l1[5],24)-7;
  const sx=Math.sin(p.t)*TO,sy=hipY-Math.cos(p.t)*TO;

    ctx.fillStyle=white?'#fff':col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();

  };
  limb(AB,12,SKIN,true);dot(AB[4],AB[5],8,c.glove,true);

  dot(hx,hy,15,SKIN);
  if(!white){
    ctx.strokeStyle=c.accent;ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(hx+14,hy-6);ctx.lineTo(hx-14,hy-6);ctx.lineTo(hx-27,hy+1);ctx.stroke();
    ctx.fillStyle=OUT;ctx.beginPath();ctx.arc(hx+8,hy+1,2.2,0,7);ctx.fill();
  }

  ctx.restore();
}

  ctx.fillStyle='rgba(5,5,15,.62)';ctx.fillRect(0,0,W,H);
  txt('НОЧНОЙ ТУРНИР',W/2,118,76,'#ffd24a');
  txt('файтинг в баре',W/2,152,22,'#e8e8e8');
  txt('[1] / ✕   Игрок против компьютера',W/2,196,24,'#fff');
  txt('[2] / ○   Два игрока',W/2,226,24,'#fff');
  txt('[3] / △   Тренировка',W/2,256,24,'#ffd24a');
  txt('[4] / □   Игра по сети',W/2,286,24,'#7dff8a');
  txt('[5] / Options   Управление',W/2,316,24,'#9fd8ff');
  const y=376;
  padInfo().forEach((t,i)=>txt('Геймпад: '+t,W/2,340+i*15,12,/игрок/.test(t)?'#7dff8a':'#bbb','center',true));
  txt('ГЕЙМПАД:  '+padLine(),W/2,y+8,14,'#ffe08a','center',true);
  txt('ИГРОК 1:  '+kbLine(0),W/2,y+34,13,'#9fd0ff','center',true);
  txt('ИГРОК 2:  '+kbLine(1),W/2,y+60,13,'#ffb0a0','center',true);
  txt('Рука 1 — джеб в голову · рука 2 — хук в корпус · нога 1 — в голову · нога 2 — в корпус · бег только вперёд',W/2,y+96,15,'#ddd','center',true);
  txt('Присед + рука — апперкот · присед + нога — подсечка (блокируй сидя) · удар в прыжке пробивает блок сидя',W/2,y+120,15,'#ddd','center',true);
  txt('Спецприём тратит синюю шкалу · Esc / Create — в меню · Options — подтвердить / реванш',W/2,y+144,15,'#ddd','center',true);
}
// ---------- экран выбора бойца ----------
// сетка 3×2 на картинке: номер бойца из CH в каждой рамке, -1 — боец ещё не готов (ЛамаГёрл)
const GRID=[4,5,-2,-2,-2,-2]; // -2 — пустая рамка
const SELBG=new Image();SELBG.src='assets/select_bg.jpg';
const SELP={'4':new Image(),'5':new Image()};SELP['4'].src='assets/select_horse.png';SELP['5'].src='assets/select_lama.png';
const SLOT=s=>({x:277+(s%3)*139.5,y:105.5+(s/3|0)*174.4,w:127,h:158});
const imgOk=im=>im&&im.complete&&im.naturalWidth>0;
// шаг курсора по сетке; пустые рамки перескакиваются
function selMove(ci,dx,dy){
  const s=GRID.indexOf(ci);let c=s%3,r=s/3|0;
  for(let k=0;k<3;k++){
    c=(c+dx+3)%3;r=(r+dy+2)%2;
    if(GRID[r*3+c]>=0)return GRID[r*3+c];
  }
  return ci;
}
const SELF=[{},{}];
function drawSelect(){
  if(imgOk(SELBG))ctx.drawImage(SELBG,0,0,W,H);else{ctx.fillStyle='#0a0d14';ctx.fillRect(0,0,W,H);}
  txt('ВЫБОР БОЙЦА',W/2,60,44,'#ffd24a');
  if(NET.on)txt('Игра по сети · ты — '+(NET.me?'P2 (красная рамка)':'P1 (синяя рамка)'),W/2,88,16,'#7dff8a','center',true);
  else if(G.mode===1)txt(`Сложность ИИ:  ${DIFF[G.diff][0]}   (${ctlLabel('run')} — легче · ${ctlLabel('blk')} — сложнее)`,W/2,88,16,'#ffd24a','center',true);
  for(let s=0;s<6;s++){
    const{x,y,w,h}=SLOT(s),ci=GRID[s],im=SELP[ci];
    if(imgOk(im))ctx.drawImage(im,x,y,w,h);
    else if(ci>=0){ // рисованный боец в рамке
      ctx.save();ctx.beginPath();ctx.rect(x+9,y+9,w-18,h-18);ctx.clip();
      ctx.translate(x+w/2-4,y+h-26);ctx.scale(.62,.62);
      drawF({x:0,y:0,facing:1,alpha:1,flash:0,ch:CH[ci],i:0,pose:{...clonePose(P.idle),t:.1+.03*Math.sin(frame*.08+s)}});
      ctx.restore();
      txt(CH[ci].name,x+w/2,y+h-13,12,'#ccc','center',true);
    }
    if(ci===-1){ctx.fillStyle='rgba(8,8,12,.6)';ctx.fillRect(x+8,y+8,w-16,h-16);txt('СКОРО',x+w/2,y+h/2+7,20,'#bbb');}
  }
  for(let pl=0;pl<2;pl++){
    const ai=pl===1&&G.mode===1,shown=!ai||G.ok[1],col=pl?'#ff5a4a':'#4aa8ff',c=CH[G.sel[pl]],cx=pl?820:140;
    txt(pl?(ai?'ИИ':'ИГРОК 2'):'ИГРОК 1',cx,150,22,col);
    if(!shown){txt('?',cx,340,120,'#444');continue;}
    // рамка в сетке: мигает, пока боец не подтверждён
    const{x,y,w,h}=SLOT(GRID.indexOf(G.sel[pl])),o=pl&&G.sel[0]===G.sel[1]?7:0;
    ctx.save();ctx.shadowColor=col;ctx.shadowBlur=16;ctx.strokeStyle=col;ctx.lineWidth=G.ok[pl]?6:4;
    ctx.globalAlpha=G.ok[pl]?1:.55+.45*Math.sin(frame*.16+pl*2);
    ctx.strokeRect(x+2+o,y+2+o,w-4-o*2,h-4-o*2);ctx.restore();
    txt(pl?(ai?'ИИ':'P2'):'P1',pl?x+w-20:x+20,y+26+o,18,col);
    // выбранный боец крупно сбоку
    const f=SELF[pl];
    if(f.ch!==c){for(const k in f)delete f[k];f.ch=c;}
    Object.assign(f,{noShadow:true,x:0,y:0,facing:pl?-1:1,alpha:1,flash:0,i:pl,alt:pl===1&&G.sel[0]===G.sel[1],pose:{...clonePose(P.idle),t:.1+.03*Math.sin(frame*.08+pl)}});
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(cx,462,62,10,0,0,7);ctx.fill();
    ctx.save();ctx.translate(cx,458);ctx.scale(1.4,1.4);drawF(f);ctx.restore();
    txt(c.name,cx,494,26,'#fff');
    if(G.ok[pl])txt('ГОТОВ',cx,180,18,'#7dff8a');
  }
  txt('Стрелки / крестовина — боец · любая кнопка удара — подтвердить · Esc / Create — в меню',W/2,528,13,'#bbb','center',true);
}
function render(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>.5){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;}
  const menu=G.phase==='menu'||G.phase==='select'||G.phase==='net'||G.phase==='keys',cx=Math.round(menu?(WW-W)/2+Math.sin(frame*.004)*(WW-W)/2:camX);
  ctx.save();ctx.translate(-cx,0);
  drawArena();
  if(menu){ctx.restore();if(G.phase==='menu')drawMenu();else if(G.phase==='net')drawNet();else if(G.phase==='keys')drawKeys();else drawSelect();ctx.restore();return;}
  for(const p of parts)if(p.st){ctx.globalAlpha=clamp(p.life/70,0,.85);ctx.fillStyle=p.col;ctx.fillRect(p.x-p.size*1.3,p.y-p.size*.3,p.size*2.6,p.size*.6);}
  ctx.globalAlpha=1;
  for(const f of F){
    if(drawShadow(f.i))continue;
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();
    ctx.ellipse(f.x,GY+3,Math.max(14,40-(GY-f.y)*.12),7,0,0,7);ctx.fill();
  }
  const order=F[0].state==='attack'?[F[1],F[0]]:[F[0],F[1]];
  for(const f of order)drawF(f);
  SPFX=SPFX.filter(e=>frame-e.t0<16&&imgOk(e.spr.img));
  for(const e of SPFX){ // брызги плевка
    const s=e.spr,fr=frame-e.t0<8?4:7,sc=.62;
    ctx.save();ctx.globalAlpha=frame-e.t0<10?1:(16-(frame-e.t0))/6;ctx.translate(e.x,e.y);ctx.scale(e.dir*sc,sc);
    ctx.drawImage(s.img,fr*s.cw,0,s.cw,s.ch,-s.cw/2,-s.ch/2,s.cw,s.ch);ctx.restore();
  }
  for(const p of projs){
    if(p.spr&&imgOk(p.spr.img)){ // плевок: вылет, потом полёт кадрами 1-3
      const s=p.spr,k=frame-p.t0,fr=k<5?0:1+((k-5)/5|0)%3,sc=.58;
      ctx.save();ctx.translate(p.x,p.y);ctx.scale(Math.sign(p.vx)*sc,sc);
      ctx.drawImage(s.img,fr*s.cw,0,s.cw,s.ch,-s.cw*.62,-s.ch/2,s.cw,s.ch);ctx.restore();continue;
    }
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,22);
    g.addColorStop(0,'#fff');g.addColorStop(.35,p.col);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,22,0,7);ctx.fill();
  }
  for(const p of parts){
    ctx.fillStyle=p.col;
    if(p.st)continue; // пятна на полу нарисованы под бойцами
    else{ctx.globalAlpha=clamp(p.life/14,0,1);ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}
  }
  ctx.globalAlpha=1;
  if(ARENA_FG.complete&&ARENA_FG.naturalWidth)ctx.drawImage(ARENA_FG,3041*WW/3584,919*H/1184,338*WW/3584,265*H/1184); // передний план перекрывает бойцов
  ctx.restore();
  hud();
  if(NET.on)drawNetHud();
  for(const f of F)if(f.state==='grab'&&f.gr&&f.gr.phase==='qte')drawQTE(f);
  if(G.phase==='intro')txt(`РАУНД ${G.round}`,W/2,250,80,'#ffd24a');
  else if(G.phase==='fight'&&G.t<45)txt('БОЙ!',W/2,250,100,'#ff5a4a');
  else if(G.phase==='ko'){
    txt(G.timeout?'ВРЕМЯ!':'НОКАУТ!',W/2,230,96,'#ff5a4a');
    if(G.t>80)txt(G.winner?`${G.winner.ch.name} ПОБЕЖДАЕТ`:'НИЧЬЯ',W/2,300,40,'#fff');
  }else if(G.phase==='end'){
    const w=F.find(f=>f.wins>=2);
    txt('ПОБЕДИТЕЛЬ',W/2,200,50,'#fff');
    txt(w.ch.name+(w.cpu?' (ИИ)':''),W/2,280,90,'#ffd24a');
    txt('Enter / Options — реванш · Esc / Create — меню',W/2,340,22,'#ddd');
  }
  ctx.restore();
}

// ---------- цикл ----------
let last=performance.now(),acc=0;
const STEP=1000/60;
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=STEP){
    if(NET.on){if(!netFrame()){acc=Math.min(acc,STEP);break;}}
    else{tick();pressed.clear();}
    acc-=STEP;
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
